<!DOCTYPE html>
<html lang="ca">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PasteBlock · Obrador Màgic Guadiana</title>
  <meta name="description" content="PasteBlock: el Blast de pastissos de la Obrador Màgic Guadiana. Fes grups de pastissos iguals i suma punts!" />
  <link rel="stylesheet" href="../../assets/css/base.css" />
  <link rel="stylesheet" href="../../assets/css/components.css" />
  <link rel="stylesheet" href="pasteblock.css" />
</head>
<body class="bg-cream">

  <!-- Navbar -->
  <nav class="navbar">
    <a href="../../index.html" class="navbar-brand">🎂 <span>Obrador Màgic Guadiana</span></a>
    <div class="navbar-nav">
      <a href="../../mapa.html" class="nav-link">← Mapa</a>
    </div>
    <div class="navbar-user">
      <div id="nav-user-area" class="flex flex-center gap-1">
        <img class="navbar-avatar" id="nav-avatar" src="" alt="Avatar" />
        <span id="nav-username" style="font-weight:700;font-size:0.9rem"></span>
      </div>
    </div>
  </nav>

  <main class="game-page">

    <!-- HUD -->
    <div class="container">
      <div class="game-hud">
        <div class="hud-item">
          <span class="hud-label">Punts</span>
          <span class="hud-value" id="score">0</span>
        </div>
        <div class="hud-item">
          <span class="hud-label">Millor</span>
          <span class="hud-value" id="best-score">0</span>
        </div>
        <div class="hud-item">
          <span class="hud-label">Nivell</span>
          <span class="hud-value" id="level">1</span>
        </div>
        <div class="hud-item">
          <span class="hud-label">Moviments</span>
          <span class="hud-value" id="moves">∞</span>
        </div>
        <div style="display:flex;gap:0.5rem">
          <button class="btn btn-outline btn-sm" id="btn-restart">↺ Reiniciar</button>
          <button class="btn btn-primary btn-sm" id="btn-ranking">🏆 Rànquing</button>
        </div>
      </div>
    </div>

    <!-- Tauler de joc -->
    <div class="container flex-center" style="flex-direction:column;gap:1rem">
      <div class="pb-board-wrap">
        <canvas id="pb-canvas" class="pb-canvas"></canvas>
        <div class="pb-overlay hidden" id="pb-overlay">
          <div class="pb-overlay-content animate-bounce-in">
            <div id="overlay-emoji" style="font-size:4rem">🎂</div>
            <h2 id="overlay-title" class="pb-overlay-title">Fi del Joc!</h2>
            <p id="overlay-score" class="pb-overlay-score">0 punts</p>
            <p id="overlay-msg" class="pb-overlay-msg"></p>
            <div style="display:flex;gap:0.75rem;justify-content:center;flex-wrap:wrap;margin-top:1rem">
              <button class="btn btn-primary btn-lg" id="overlay-restart">Tornar a jugar!</button>
              <a href="../../mapa.html" class="btn btn-outline btn-lg">← Mapa</a>
            </div>
          </div>
        </div>
      </div>

      <!-- Instruccions -->
      <div class="pb-instructions">
        <div class="pb-instruction">
          <span>👆</span>
          <span>Clica un grup de pastissos iguals per eliminar-los</span>
        </div>
        <div class="pb-instruction">
          <span>🎯</span>
          <span>Grups més grans = més punts!</span>
        </div>
        <div class="pb-instruction">
          <span>⚠️</span>
          <span>El joc acaba si no hi ha grups de 2 o més</span>
        </div>
      </div>
    </div>

    <!-- Ranking panel -->
    <div class="container mt-3">
      <div class="card">
        <div class="card-header">
          <h3>🏆 Rànquing PasteBlock</h3>
        </div>
        <div class="card-body" id="ranking-container">
          <div class="flex-center"><div class="spinner"></div></div>
        </div>
      </div>
    </div>

  </main>

  <!-- Modal rànquing -->
  <div class="modal-overlay hidden" id="ranking-modal">
    <div class="modal">
      <div class="modal-header">
        <h2 class="modal-title">🏆 Rànquing PasteBlock</h2>
        <button class="modal-close" id="close-ranking">✕</button>
      </div>
      <div class="modal-body" id="ranking-modal-body"></div>
    </div>
  </div>

  <div id="toast-container"></div>
  <script type="module" src="pasteblock.js"></script>
</body>
</html>
