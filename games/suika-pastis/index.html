<!DOCTYPE html>
<html lang="ca">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Fusió Pastissera · Obrador Màgic Guadiana</title>
  <meta name="description" content="Joc estil Suika Game amb els pastissos de la Obrador Màgic Guadiana. Combina els pastissos per fer-los més grans!" />
  <link rel="stylesheet" href="../../assets/css/base.css" />
  <link rel="stylesheet" href="../../assets/css/components.css" />
  <link rel="stylesheet" href="suika-pastis.css" />
  <!-- Matter.js per les físiques 2D -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/matter-js/0.19.0/matter.min.js"></script>
</head>
<body class="bg-cream">

  <nav class="navbar">
    <a href="../../index.html" class="navbar-brand">🎂 <span>Obrador Màgic Guadiana</span></a>
    <div class="navbar-nav"><a href="../../mapa.html" class="nav-link">← Mapa</a></div>
    <div class="navbar-user">
      <div id="nav-user-area" class="flex flex-center gap-1">
        <img class="navbar-avatar" id="nav-avatar" src="" alt="" />
        <span id="nav-username" style="font-weight:700;font-size:0.9rem"></span>
      </div>
    </div>
  </nav>

  <main class="game-page">
    <div class="container">
      
      <div class="game-hud">
        <div class="hud-item">
          <span class="hud-label">Punts</span>
          <span class="hud-value" id="score">0</span>
        </div>
        <div class="hud-item">
          <span class="hud-label">Millor</span>
          <span class="hud-value" id="best">0</span>
        </div>
        <div class="hud-item">
          <span class="hud-label">Següent</span>
          <span class="hud-value" id="next-piece" style="font-size:1.8rem">🍪</span>
        </div>
        <button class="btn btn-outline btn-sm" id="btn-restart">↺ Reiniciar</button>
      </div>

      <div class="suika-board-wrap">
        <div class="suika-game-container" id="game-container">
          <!-- El canvas de Matter.js s'injectarà aquí -->
          
          <!-- Línia de límit (Game Over si es traspassa) -->
          <div class="suika-limit-line"></div>
          
          <!-- Element que mostra la peça que està a punt de caure -->
          <div class="suika-dropper hidden" id="dropper">🍪</div>
        </div>
        
        <div class="suika-overlay hidden" id="suika-overlay">
          <div class="suika-overlay-content animate-bounce-in">
            <div id="suika-emoji" style="font-size:4rem">🎂</div>
            <h2 id="suika-title" class="suika-overlay-title">El Pot s'ha omplert!</h2>
            <p id="suika-score" class="suika-overlay-score">0 punts</p>
            <div style="display:flex;gap:0.75rem;justify-content:center;margin-top:1.5rem;flex-wrap:wrap">
              <button class="btn btn-primary btn-lg" id="btn-play-again">Tornar a jugar!</button>
              <a href="../../mapa.html" class="btn btn-outline btn-lg">← Mapa</a>
            </div>
          </div>
        </div>
      </div>

      <div class="suika-instructions">
        <span>🖱️ Clica i arrossega per moure • Deixa anar per llançar</span>
        <span>•</span>
        <span>🎂 Combina pastissos iguals per crear-ne de més grans!</span>
      </div>

      <div class="suika-evolution">
        <span>Evolució:</span>
        <div class="evolution-chain">
          🍪 <span>→</span> 🧁 <span>→</span> 🥐 <span>→</span> 🍰 <span>→</span> 🍩 <span>→</span> 🥧 <span>→</span> 🎂 <span>→</span> <img src="../../assets/img/sasha.png" style="height: 1.5em; vertical-align: middle;">
        </div>
      </div>

    </div>

    <div class="container mt-3">
      <div class="card">
        <div class="card-header"><h3>🏆 Rànquing Fusió Pastissera</h3></div>
        <div class="card-body" id="ranking-container"><div class="flex-center"><div class="spinner"></div></div></div>
      </div>
    </div>
  </main>
  
  <div id="toast-container"></div>
  <script type="module" src="suika-pastis.js"></script>
</body>
</html>
